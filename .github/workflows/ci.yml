name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck build.sh install.sh

  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          pacman -Sy --noconfirm archiso sudo git base-devel
          echo 'builduser ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builduser

      - name: Build ISO
        run: ./build.sh

      - name: Upload ISO
        if: always()
        run: |
          cd out
          for f in *.iso; do mv "$f" "$(echo "$f" | tr ':' '-')"; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iso
          path: out/*.iso
          retention-days: 7

  boot-test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download ISO
        uses: actions/download-artifact@v4
        with:
          name: iso

      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils

      - name: Boot ISO in QEMU
        run: |
          ISO=$(ls *.iso)

          # Extract kernel and initramfs from the ISO so we can append
          # console=ttyS0 for serial output in headless mode.
          mkdir iso_mount
          sudo mount -o loop "$ISO" iso_mount
          cp iso_mount/arch/boot/x86_64/vmlinuz-linux vmlinuz
          cp iso_mount/arch/boot/x86_64/initramfs-linux.img initramfs
          LABEL=$(blkid -s LABEL -o value "$ISO")
          sudo umount iso_mount

          # Create a virtual disk for the install test.
          qemu-img create -f qcow2 test-disk.qcow2 20G

          # Boot the ISO headless, logging serial output to a file.
          touch boot.log
          qemu-system-x86_64 \
            -kernel vmlinuz \
            -initrd initramfs \
            -append "archisolabel=$LABEL console=ttyS0" \
            -cdrom "$ISO" \
            -m 2G \
            -display none \
            -serial file:boot.log \
            -drive file=test-disk.qcow2,format=qcow2 &
          QEMU_PID=$!

          # Stream the serial log live for visibility during the wait.
          tail -f boot.log &
          TAIL_PID=$!

          # Poll the file directly: agetty's "archiso login: " prompt has no
          # trailing newline, so `grep` over `tail -f` would buffer the partial
          # line forever. Re-running grep on the file sees EOF each pass.
          status=1
          for _ in $(seq 1 60); do
            if grep -q "archiso login" boot.log; then
              echo "Login prompt detected, boot successful."
              status=0
              break
            fi
            sleep 5
          done
          [ $status -ne 0 ] && echo "Timed out waiting for login prompt."

          kill $TAIL_PID 2>/dev/null || true
          kill $QEMU_PID 2>/dev/null || true
          exit $status

          # TODO: automate install.sh test against the virtual disk.
