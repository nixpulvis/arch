name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck build.sh install.sh test/*.sh

  build-iso:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          pacman -Sy --noconfirm archiso sudo git base-devel
          echo 'builduser ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builduser

      - name: Build ISO
        run: ./build.sh

      - name: Upload ISO
        if: always()
        run: |
          cd out
          for f in *.iso; do mv "$f" "$(echo "$f" | tr ':' '-')"; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iso
          path: out/*.iso
          retention-days: 7

  boot-iso:
    runs-on: ubuntu-latest
    needs: build-iso
    steps:
      - uses: actions/checkout@v4

      - name: Download ISO
        uses: actions/download-artifact@v4
        with:
          name: iso
          path: out

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils \
              expect libarchive-tools

      # GitHub runners don't expose /dev/kvm, so QEMU runs under TCG.
      # Boot reaches the login prompt much slower than locally — pad the
      # per-step timeout accordingly.
      - name: Boot ISO smoke test
        env:
          TIMEOUT: "1800"
        run: ./test/boot.sh out/*.iso

  install-iso:
    runs-on: ubuntu-latest
    needs: build-iso
    steps:
      - uses: actions/checkout@v4

      - name: Download ISO
        uses: actions/download-artifact@v4
        with:
          name: iso
          path: out

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils \
              expect libarchive-tools

      - name: Install via bundled installer
        env:
          TIMEOUT: "3600"
        run: ./test/install-iso.sh out/*.iso

  install-dual:
    runs-on: ubuntu-latest
    needs: build-iso
    steps:
      - uses: actions/checkout@v4

      - name: Download ISO
        uses: actions/download-artifact@v4
        with:
          name: iso
          path: out

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils \
              expect libarchive-tools ovmf

      - name: Dual install + menu check
        env:
          TIMEOUT: "3600"
        run: ./test/install-dual.sh out/*.iso
