name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: shellcheck
        run: shellcheck build.sh format.sh install.sh test/*.sh

  build-iso:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          pacman -Sy --noconfirm archiso sudo git base-devel curl
          echo 'builduser ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builduser

      - name: Build ISO
        run: ./build.sh

      - name: Upload ISO
        if: always()
        run: |
          cd out
          for f in *.iso; do mv "$f" "$(echo "$f" | tr ':' '-')"; done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: iso
          path: out/*.iso
          retention-days: 7

  boot-iso:
    runs-on: ubuntu-latest
    needs: build-iso
    steps:
      - uses: actions/checkout@v6

      - name: Download ISO
        uses: actions/download-artifact@v8
        with:
          name: iso
          path: out

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils \
              expect libarchive-tools

      - name: Boot ISO smoke test
        env:
          LONG_TIMEOUT: "1800"
        run: ./test/boot.sh out/*.iso

  install-iso:
    runs-on: ubuntu-latest
    needs: build-iso
    strategy:
      fail-fast: false
      matrix:
        layout: [single, dual]
    steps:
      - uses: actions/checkout@v6

      - name: Download ISO
        uses: actions/download-artifact@v8
        with:
          name: iso
          path: out

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils \
              expect libarchive-tools ovmf

      - name: Install via bundled installer + menu check (${{ matrix.layout }})
        env:
          LONG_TIMEOUT: "3600"
        run: |
          flags=""
          [ "${{ matrix.layout }}" = "dual" ] && flags="-d"
          # shellcheck disable=SC2086
          ./test/install.sh -i $flags out/*.iso
